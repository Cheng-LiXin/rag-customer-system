# =============================================================================
# 前端 nginx 站点配置（容器内 /etc/nginx/conf.d/default.conf）
# -----------------------------------------------------------------------------
# 职责：① 托管 SPA 静态产物；② 把 /api 反代到后端；③ 把 /ws 反代到后端（WebSocket）。
# =============================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源体积不大，开个 gzip 省带宽
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- SPA 路由回落 ----------
    # /profile、/admin/* 这些是前端路由，刷新时服务端并无对应文件，必须回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ SSE 必须关缓冲。
        # 开了 proxy_buffering（默认就是开的），nginx 会把响应攒在缓冲区里再一次性发出，
        # 于是「流式打字机效果」直接变成等待若干秒后整段出现 —— 演示当场露馅。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # 冷路径问答（检索 + 大模型）可能十几秒，超时给足
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---------- WebSocket（人工客服）----------
    # 前端连的是 ${location.host}/ws/customer-service，必须带 Upgrade 头才能升级协议
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # 人工客服会话可能长时间无消息（有 10 分钟自动结束兜底，但不要由 nginx 先掐断）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
