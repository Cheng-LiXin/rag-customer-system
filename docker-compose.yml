# =============================================================================
# Docker Compose
# -----------------------------------------------------------------------------
# 两种用法（用 profile 隔开，互不干扰）：
#
#   ① 只起依赖 —— 本机 IDEA / 命令行跑后端时用，行为与改动前完全一致
#        docker compose up -d
#
#   ② 全栈一键起 —— 后端 + 前端 + MySQL + PG + Redis 全容器化，「部署上线可演示」
#        docker compose --profile full up -d --build
#        访问 http://localhost:8081
#
# 为什么用 profile 而不是合并成一个：本机开发时后端跑在宿主机 8080，
# 若全栈服务默认也起，会与本机进程抢端口。profile 让两套用法各自干净。
# =============================================================================

services:
  # ---------------- 基础设施（两种用法都需要）----------------
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: [ "redis-server", "--appendonly", "yes" ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  postgres:
    image: pgvector/pgvector:pg15
    container_name: rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_vector
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      # ★ 向量数据单独一个卷：重建 MySQL 时只删 mysql-data，别用 `down -v` 全清，
      #   否则 152 条向量会一起没掉，得重新调 embedding 向量化（花钱花时间）。
      - pg-data:/var/lib/postgresql/data
      - ./init-pg.sql:/docker-entrypoint-initdb.d/init-pg.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-postgres} -d rag_vector" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------- 全栈服务（仅 --profile full）----------------
  mysql:
    image: mysql:8.4
    container_name: rag-mysql
    profiles: [ "full" ]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: rag_customer
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      # 映射 3307 避开本机 3306；容器内部仍是 mysql:3306
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅在**数据卷为空**的首次启动时执行。详见 tools/docker/initdb/README.md
      - ./tools/docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: rag-customer-backend:latest
    container_name: rag-backend
    profiles: [ "full" ]
    restart: unless-stopped
    environment:
      # 激活 application-docker.yml：把 localhost 换成容器服务名，且不含任何口令
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      # 演示账号：首次建号用这里的口令；容器侧默认**不**重置已存在账号的密码
      # （见 application-docker.yml 的 rag.demo.reset-passwords=false）
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin@Ysu2026}
      DEMO_AGENT_PASSWORD: ${DEMO_AGENT_PASSWORD:-Agent@Ysu2026}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-User@Ysu2026}
      DEMO_RESET_PASSWORDS: ${DEMO_RESET_PASSWORDS:-false}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx768m}
    # 不映射到宿主机：对外只暴露 nginx 的 8081，/api 与 /ws 由 nginx 反代。
    # 这也顺带避开了 Windows 上 8080 被 winnat 排除端口占用的问题。
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/api/rag/hello" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: rag-customer-frontend:latest
    container_name: rag-frontend
    profiles: [ "full" ]
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"
    # 用 service_started（默认）而不是 service_healthy：nginx 先起来，
    # 后端还没就绪时 /api 返回 502，前端页面本身仍可打开，比整站不可见更好排查。
    depends_on:
      - backend

  # ---------------- 可观测性（批次 F，仅 --profile full）----------------
  prometheus:
    image: prom/prometheus:latest
    container_name: rag-prometheus
    profiles: [ "full" ]
    restart: unless-stopped
    volumes:
      - ./tools/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: rag-grafana
    profiles: [ "full" ]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      # 演示环境不开放注册，避免陌生人自建账号
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # 数据源与看板都走 provisioning：容器一起来就是配好的，不用手工点
      - ./tools/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./tools/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  redis-data:
  pg-data:
  mysql-data:
  prometheus-data:
  grafana-data:
